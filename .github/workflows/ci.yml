name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test, vet, and security checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
          check-latest: false
      - name: Download modules
        run: go mod download
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Test reverse-proxy trust boundary
        run: go run ./tests/proxy
      - name: Test OIDC bearer and group contract
        run: go run ./tests/oidc
      - name: Install pinned security tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Check known vulnerabilities
        run: govulncheck ./...
      - name: Run Go security analysis
        run: gosec ./...
      - name: Scan tracked history for secrets
        run: gitleaks git --redact --no-banner

  docker:
    name: Build container
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build Docker image
        run: docker build --pull --tag shortlinks:ci .
