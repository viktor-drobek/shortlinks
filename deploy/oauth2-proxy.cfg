# Supply OAUTH2_PROXY_OIDC_ISSUER_URL and secret-file paths in private runtime configuration.
# The identity provider must issue the exact /links group in both ID and access tokens.
provider = "oidc"
client_id = "shortlinks-web"
redirect_url = "https://s.2050.su/oauth2/callback"
scope = "openid profile"
code_challenge_method = "S256"
email_domains = ["*"]
oidc_email_claim = "preferred_username"
oidc_groups_claim = "groups"
insecure_oidc_allow_unverified_email = true
allowed_groups = ["/links"]
http_address = "0.0.0.0:4180"
reverse_proxy = true
upstreams = ["static://202"]
set_xauthrequest = true
pass_access_token = false
pass_authorization_header = false
pass_basic_auth = false
skip_jwt_bearer_tokens = true
bearer_token_login_fallback = false
api_routes = ["^/api/v1/"]
skip_provider_button = true
cookie_name = "__Host-shortlinks"
cookie_path = "/"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "8h"
cookie_refresh = "5m"
cookie_csrf_per_request = true
request_logging = false
silence_ping_logging = true
